# The Roads Ahead print server, on Cloudflare's free plan. Setup steps are in README.md.
name = "roads-ahead-poster"
main = "src/index.js"
compatibility_date = "2026-11-01"

[vars]
# Where this Worker is reached (its workers.dev address is fine): Stripe sends the
# browser back here, and Prodigi fetches the PDFs from here.
PUBLIC_URL = "https://roads-ahead-poster.example.workers.dev"
APP_SCHEME = "roadtrip"
# Fine-art prints. Check them in Prodigi's sandbox catalogue before going live.
PRODIGI_SKU_A3 = "GLOBAL-FAP-A3"
PRODIGI_SKU_A2 = "GLOBAL-FAP-A2"
PRODIGI_SHIPPING = "standard"
# Secrets, set with `npx wrangler secret put <NAME>`:
# STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, PRODIGI_API_KEY, ASSET_SECRET

[[r2_buckets]]
binding = "POSTERS"
bucket_name = "poster-pipeline-production"

[observability]
enabled = true
